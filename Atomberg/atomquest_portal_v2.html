<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AtomQuest — Goal Setting & Tracking Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --black:#0a0a0a;
  --black2:#111111;
  --black3:#1a1a1a;
  --black4:#222222;
  --black5:#2d2d2d;
  --yellow:#f5c518;
  --yellow2:#e6b800;
  --yellow3:#ffd740;
  --yellow-dim:rgba(245,197,24,0.12);
  --yellow-dim2:rgba(245,197,24,0.06);
  --white:#f0f0f0;
  --grey:#888;
  --grey2:#555;
  --red:#e53935;
  --green:#4caf50;
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:6px;
  --shadow:0 4px 24px rgba(0,0,0,0.6);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--white);font-family:var(--font-body);font-size:14px;min-height:100vh;overflow-x:hidden;}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--black2);}
::-webkit-scrollbar-thumb{background:var(--yellow2);border-radius:3px;}

/* UTILITY */
.hidden{display:none!important;}
.flex{display:flex;}
.items-center{align-items:center;}
.gap-1{gap:4px;}
.gap-2{gap:8px;}
.gap-3{gap:12px;}
.yellow{color:var(--yellow);}
.red{color:var(--red);}
.green{color:var(--green);}
.grey{color:var(--grey);}
.mono{font-family:var(--font-mono);}
.w-full{width:100%;}
.mb-1{margin-bottom:4px;}
.mb-2{margin-bottom:8px;}
.mb-3{margin-bottom:12px;}
.mb-4{margin-bottom:16px;}
.mt-2{margin-top:8px;}
.mt-3{margin-top:12px;}
.mt-4{margin-top:16px;}
.text-sm{font-size:12px;}
.text-lg{font-size:16px;}
.text-xl{font-size:20px;}
.font-bold{font-weight:700;}
.italic{font-style:italic;}

/* TOAST */
#toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{background:var(--black3);border-left:3px solid var(--yellow);padding:12px 16px;border-radius:var(--radius);font-size:13px;color:var(--white);animation:slideIn .3s ease;box-shadow:var(--shadow);pointer-events:auto;max-width:320px;}
.toast.error{border-color:var(--red);}
.toast.success{border-color:var(--green);}
@keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes fadeOut{from{opacity:1;}to{opacity:0;}}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--black);z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:32px;}
.login-logo{font-family:var(--font-display);font-size:72px;color:var(--yellow);letter-spacing:4px;text-align:center;line-height:1;}
.login-logo span{color:var(--white);}
.login-sub{font-size:13px;color:var(--grey);text-align:center;letter-spacing:2px;text-transform:uppercase;}
.login-card{background:var(--black3);border:1px solid var(--black5);border-radius:8px;padding:32px;width:380px;box-shadow:var(--shadow);}
.login-card h2{font-family:var(--font-display);font-size:28px;color:var(--yellow);margin-bottom:24px;letter-spacing:1px;}
.role-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px;}
.role-btn{background:var(--black4);border:1px solid var(--black5);color:var(--grey);padding:10px 6px;border-radius:var(--radius);cursor:pointer;font-size:12px;text-align:center;transition:all .2s;font-family:var(--font-body);}
.role-btn:hover,.role-btn.active{background:var(--yellow-dim);border-color:var(--yellow);color:var(--yellow);}
.input-group{margin-bottom:16px;}
.input-group label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--grey);margin-bottom:6px;}
.input-group input,.input-group select,.input-group textarea{width:100%;background:var(--black2);border:1px solid var(--black5);color:var(--white);padding:10px 12px;border-radius:var(--radius);font-family:var(--font-body);font-size:13px;transition:border .2s;outline:none;}
.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--yellow);}
.input-group select option{background:var(--black2);}
.input-group textarea{resize:vertical;min-height:80px;}
.btn{padding:10px 20px;border-radius:var(--radius);border:none;cursor:pointer;font-family:var(--font-body);font-weight:600;font-size:13px;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--yellow);color:var(--black);} .btn-primary:hover{background:var(--yellow3);}
.btn-ghost{background:transparent;color:var(--yellow);border:1px solid var(--yellow);} .btn-ghost:hover{background:var(--yellow-dim);}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);} .btn-danger:hover{background:rgba(229,57,53,.1);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-xs{padding:4px 8px;font-size:11px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.sso-btn{background:var(--black4);border:1px solid var(--black5);color:var(--white);padding:10px;border-radius:var(--radius);cursor:pointer;font-size:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;font-family:var(--font-body);margin-bottom:16px;}
.sso-btn:hover{border-color:var(--yellow);color:var(--yellow);}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--grey2);font-size:11px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--black5);}

/* APP LAYOUT */
#app{display:flex;min-height:100vh;}
#sidebar{width:220px;min-width:220px;background:var(--black2);border-right:1px solid var(--black5);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;}
.sidebar-logo{padding:20px;border-bottom:1px solid var(--black5);}
.sidebar-logo .name{font-family:var(--font-display);font-size:28px;color:var(--yellow);letter-spacing:2px;}
.sidebar-logo .version{font-size:10px;color:var(--grey);letter-spacing:1px;text-transform:uppercase;}
.sidebar-user{padding:16px;border-bottom:1px solid var(--black5);}
.user-avatar{width:36px;height:36px;background:var(--yellow);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px;color:var(--black);flex-shrink:0;}
.user-info{flex:1;min-width:0;}
.user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role{font-size:10px;color:var(--yellow);text-transform:uppercase;letter-spacing:1px;}
.nav-section{padding:16px 0;}
.nav-label{padding:4px 16px;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--grey2);}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;color:var(--grey);font-size:13px;transition:all .2s;border-left:3px solid transparent;position:relative;}
.nav-item:hover{color:var(--white);background:var(--yellow-dim2);}
.nav-item.active{color:var(--yellow);background:var(--yellow-dim);border-left-color:var(--yellow);}
.nav-item svg{flex-shrink:0;opacity:.7;}
.nav-item.active svg{opacity:1;}
.nav-badge{position:absolute;right:12px;background:var(--yellow);color:var(--black);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;}
.sidebar-footer{margin-top:auto;padding:16px;border-top:1px solid var(--black5);}
.cycle-info{background:var(--yellow-dim2);border:1px solid var(--black5);border-radius:var(--radius);padding:10px;margin-bottom:12px;}
.cycle-info .label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--grey);margin-bottom:4px;}
.cycle-info .value{font-size:12px;color:var(--yellow);font-weight:600;}
#main{flex:1;margin-left:220px;min-height:100vh;}
#topbar{background:var(--black2);border-bottom:1px solid var(--black5);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.page-title{font-family:var(--font-display);font-size:22px;color:var(--white);letter-spacing:1px;}
.topbar-actions{display:flex;align-items:center;gap:12px;}
.notif-btn{background:var(--black4);border:1px solid var(--black5);color:var(--grey);padding:7px;border-radius:var(--radius);cursor:pointer;position:relative;display:flex;align-items:center;transition:all .2s;}
.notif-btn:hover{color:var(--yellow);border-color:var(--yellow);}
.notif-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--yellow);border-radius:50%;}
#content{padding:28px;}

/* CARDS & TABLES */
.card{background:var(--black2);border:1px solid var(--black5);border-radius:8px;padding:20px;margin-bottom:16px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.card-title{font-family:var(--font-display);font-size:18px;color:var(--white);letter-spacing:1px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:var(--black3);border:1px solid var(--black5);border-radius:8px;padding:16px;position:relative;overflow:hidden;}
.stat-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--yellow);}
.stat-value{font-family:var(--font-display);font-size:40px;color:var(--yellow);line-height:1;}
.stat-label{font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
.stat-trend{font-size:11px;color:var(--green);margin-top:2px;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead tr{border-bottom:1px solid var(--black5);}
thead th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--grey);font-weight:600;}
tbody tr{border-bottom:1px solid var(--black4);transition:background .15s;}
tbody tr:hover{background:var(--yellow-dim2);}
tbody td{padding:10px 12px;font-size:13px;}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.badge-yellow{background:var(--yellow-dim);color:var(--yellow);}
.badge-green{background:rgba(76,175,80,.12);color:var(--green);}
.badge-red{background:rgba(229,57,53,.12);color:var(--red);}
.badge-grey{background:var(--black4);color:var(--grey);}
.badge-blue{background:rgba(33,150,243,.12);color:#2196f3;}
.progress-bar{background:var(--black4);border-radius:3px;height:6px;overflow:hidden;}
.progress-fill{background:var(--yellow);height:100%;transition:width .5s ease;border-radius:3px;}
.progress-fill.danger{background:var(--red);}
.progress-fill.success{background:var(--green);}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.col-span-2{grid-column:span 2;}
.form-row{display:flex;gap:12px;align-items:flex-end;}
.section-divider{border:none;border-top:1px solid var(--black5);margin:20px 0;}

/* GOAL CARD */
.goal-item{background:var(--black3);border:1px solid var(--black5);border-radius:6px;padding:16px;margin-bottom:12px;position:relative;}
.goal-item:hover{border-color:var(--black4);}
.goal-item .goal-num{font-family:var(--font-display);font-size:32px;color:var(--yellow);opacity:.3;position:absolute;top:10px;right:16px;line-height:1;}
.goal-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.weightage-bar{margin-top:12px;}
.weightage-label{font-size:11px;color:var(--grey);margin-bottom:4px;display:flex;justify-content:space-between;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--black2);border:1px solid var(--black5);border-radius:10px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.8);}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--black5);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-title{font-family:var(--font-display);font-size:22px;color:var(--yellow);letter-spacing:1px;}
.modal-close{background:none;border:none;color:var(--grey);cursor:pointer;font-size:20px;padding:4px;transition:color .2s;}
.modal-close:hover{color:var(--white);}
.modal-body{padding:24px;overflow-y:auto;flex:1;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--black5);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--black5);margin-bottom:20px;gap:2px;}
.tab{padding:10px 20px;cursor:pointer;font-size:13px;color:var(--grey);border-bottom:2px solid transparent;transition:all .2s;}
.tab:hover{color:var(--white);}
.tab.active{color:var(--yellow);border-bottom-color:var(--yellow);}

/* CHARTS */
.chart-container{position:relative;height:200px;}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:160px;padding:0 8px;}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bar{background:var(--yellow);border-radius:3px 3px 0 0;width:100%;transition:height .5s ease;position:relative;min-height:2px;}
.bar:hover{background:var(--yellow3);}
.bar-label{font-size:10px;color:var(--grey);text-align:center;white-space:nowrap;}
.bar-val{font-size:10px;color:var(--yellow);font-weight:700;}
.heatmap{display:grid;gap:3px;}
.heatmap-cell{border-radius:3px;aspect-ratio:1;transition:all .2s;cursor:default;}
.donut-svg{display:block;margin:auto;}

/* NOTIF PANEL */
#notif-panel{position:fixed;top:56px;right:0;width:320px;background:var(--black2);border-left:1px solid var(--black5);border-bottom:1px solid var(--black5);z-index:200;padding:16px;max-height:60vh;overflow-y:auto;box-shadow:var(--shadow);}
.notif-item{padding:12px;border-bottom:1px solid var(--black5);display:flex;gap:10px;cursor:pointer;transition:background .15s;}
.notif-item:hover{background:var(--yellow-dim2);}
.notif-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.notif-content .title{font-size:12px;font-weight:600;margin-bottom:2px;}
.notif-content .body{font-size:11px;color:var(--grey);}
.notif-content .time{font-size:10px;color:var(--grey2);margin-top:2px;}

/* AUDIT LOG */
.audit-entry{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--black4);}
.audit-dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);flex-shrink:0;margin-top:4px;}
.audit-line{font-size:12px;color:var(--grey);}
.audit-line strong{color:var(--white);}
.audit-time{font-size:10px;color:var(--grey2);margin-top:2px;font-family:var(--font-mono);}

/* ESCALATION */
.escalation-rule{background:var(--black3);border:1px solid var(--black5);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.esc-icon{width:36px;height:36px;border-radius:50%;background:var(--yellow-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* TEAMS ADAPTIVE CARD */
.teams-card{background:#201f1f;border-radius:6px;overflow:hidden;border:1px solid #444;}
.teams-header{background:#464775;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.teams-body{padding:16px;}
.teams-fact{display:flex;gap:12px;margin-bottom:8px;font-size:12px;}
.teams-fact .key{color:#aaa;min-width:100px;}
.teams-fact .val{color:#fff;}

/* PAGE SECTIONS */
.page{display:none;}
.page.active{display:block;}

/* WEIGHTAGE METER */
.wgt-meter{background:var(--black4);border-radius:4px;height:10px;overflow:hidden;margin:8px 0;}
.wgt-fill{height:100%;transition:width .4s;border-radius:4px;}
.wgt-100{background:var(--green);}
.wgt-over{background:var(--red);}
.wgt-under{background:var(--yellow);}

/* EMPTY STATE */
.empty-state{text-align:center;padding:48px 20px;color:var(--grey);}
.empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.4;}
.empty-state .text{font-size:14px;}

/* SCHEDULE TABLE */
.schedule-table tbody tr:nth-child(odd){background:var(--black3);}

/* RESPONSIVE TWEAKS */
@media(max-width:900px){
  .stat-grid{grid-template-columns:1fr 1fr;}
  .form-grid{grid-template-columns:1fr;}
  .col-span-2{grid-column:span 1;}
}

/* ANIMATION */
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.pulse{animation:pulse 2s infinite;}

/* SHARED GOAL INDICATOR */
.shared-badge{background:rgba(33,150,243,.15);border:1px solid rgba(33,150,243,.3);color:#2196f3;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}

/* CHECK-IN WINDOW */
.checkin-window{background:var(--yellow-dim);border:1px solid rgba(245,197,24,.3);border-radius:6px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.checkin-window .icon{font-size:20px;}
.checkin-window .text{font-size:13px;color:var(--yellow);font-weight:500;}

/* QOQ TREND */
.trend-up{color:var(--green);}
.trend-down{color:var(--red);}
.trend-flat{color:var(--grey);}

/* WATERMARK / GRILL */
.brand-mark{position:fixed;bottom:20px;right:20px;font-family:var(--font-display);font-size:13px;color:var(--grey2);letter-spacing:2px;opacity:.4;pointer-events:none;z-index:10;}
</style>
</head>
<body>

<div id="toast-container"></div>
<div class="brand-mark">ATOMQUEST 1.0</div>

<!-- LOGIN -->
<div id="login-screen">
  <div>
    <div class="login-logo">ATOM<span>QUEST</span></div>
    <div class="login-sub">Goal Setting & Tracking Portal · Hackathon 1.0</div>
  </div>
  <div class="login-card">
    <h2>Sign In</h2>
    <button class="sso-btn" onclick="ssoLogin()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11.4 24H0V12.6h11.4V24zM24 24H12.6V12.6H24V24zM11.4 11.4H0V0h11.4v11.4zM24 11.4H12.6V0H24v11.4z"/></svg>
      Continue with Microsoft Entra ID (SSO)
    </button>
    <div class="divider">or sign in with demo credentials</div>
    <div class="role-btns">
      <button class="role-btn active" onclick="selectRole('employee',this)">👤 Employee</button>
      <button class="role-btn" onclick="selectRole('manager',this)">👔 Manager</button>
      <button class="role-btn" onclick="selectRole('admin',this)">🛡️ Admin</button>
    </div>
    <div class="input-group">
      <label>Email</label>
      <input id="login-email" type="email" value="alice@company.com"/>
    </div>
    <div class="input-group">
      <label>Password</label>
      <input id="login-pass" type="password" value="demo1234"/>
    </div>
    <button class="btn btn-primary w-full" style="justify-content:center" onclick="doLogin()">Sign In →</button>
    <p class="mt-3 text-sm grey" style="text-align:center">Demo: Employee / Manager / Admin — password: demo1234</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div class="name">ATOMQUEST</div>
      <div class="version">Goal Portal v1.0</div>
    </div>
    <div class="sidebar-user flex items-center gap-2">
      <div class="user-avatar" id="user-avatar">A</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Alice Sharma</div>
        <div class="user-role" id="user-role-badge">Employee</div>
      </div>
    </div>
    <div class="nav-section" id="nav-items"></div>
    <div class="sidebar-footer">
      <div class="cycle-info">
        <div class="label">Active Cycle</div>
        <div class="value" id="cycle-label">Q2 Check-in · Oct 2025</div>
      </div>
      <button class="btn btn-ghost w-full" style="justify-content:center" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <div class="page-title" id="topbar-title">Dashboard</div>
      <div class="topbar-actions">
        <div style="font-size:11px;color:var(--grey);font-family:var(--font-mono);" id="topbar-date"></div>
        <div class="notif-btn" onclick="toggleNotif()" id="notif-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
          <div class="notif-dot" id="notif-dot"></div>
        </div>
      </div>
    </div>
    <div id="notif-panel" class="hidden"></div>
    <div id="content">
      <!-- Pages injected here -->
      <div id="page-dashboard" class="page"></div>

/* ===========================

const STORAGE_KEY='atomquest_state_v1';
function saveState(){
  try{
    const s={goals:state.goals,pendingGoals:state.pendingGoals,teamMembers:state.teamMembers,
             notifications:state.notifications,auditLog:state.auditLog,escalationRules:state.escalationRules,
             escalationLog:state.escalationLog,cycle:state.cycle,activeCheckinQuarter:state.activeCheckinQuarter,
             checkinWindowDates:state.checkinWindowDates,adminConfig:state.adminConfig};
    localStorage.setItem(STORAGE_KEY,JSON.stringify(s));
    const badge=document.getElementById('persist-badge');
    if(badge){badge.style.opacity='1';setTimeout(()=>badge.style.opacity='0',2000);}
  }catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    const saved=JSON.parse(raw);
    Object.assign(state,saved);
  }catch(e){}
}

function persistingToast(msg,type='info'){

}

function buildNav(){

  items.forEach(it=>{
    const d=document.createElement('div');
    d.className='nav-item';
    d.id='nav-'+it.id;
    d.innerHTML=`${it.icon}<span>${it.label}</span>`;
    if(it.id==='team'){
      const badge=document.createElement('span');
      badge.className='nav-badge';
      badge.id='pending-badge';
      badge.textContent='1';
      d.appendChild(badge);

    d.onclick=()=>navigate(it.id);

  });

function navigate(page){
  state.currentPage=page;

  state.notifications.forEach(n=>{
    const d=document.createElement('div');
    d.className='notif-item';
    d.style.opacity=n.read?'.6':'1';
    d.innerHTML=`<div class="notif-icon" style="background:var(--yellow-dim);">${n.icon}</div>
    <div class="notif-content"><div class="title">${n.title}</div><div class="body">${n.body}</div><div class="time">${n.time}</div></div>`;

function renderDonut(){
  const el=document.getElementById('donut-container');
  if(!el)return;
  const thrusts={};
  state.goals.forEach(g=>{thrusts[g.thrust]=(thrusts[g.thrust]||0)+1;});
  const total=state.goals.length;
  const colors=['#f5c518','#ffd740','#e6b800','#ffab00','#ff8f00','#ff6f00','#888','#555'];
  const items=Object.entries(thrusts);
  let cumulative=0;
  let svgPaths='';
  items.forEach(([name,count],i)=>{
    const pct=count/total;
    const startAngle=cumulative*2*Math.PI-Math.PI/2;
    const endAngle=(cumulative+pct)*2*Math.PI-Math.PI/2;
    const x1=50+40*Math.cos(startAngle);
    const y1=50+40*Math.sin(startAngle);
    const x2=50+40*Math.cos(endAngle);
    const y2=50+40*Math.sin(endAngle);
    const large=pct>0.5?1:0;
    svgPaths+=`<path d="M50,50 L${x1},${y1} A40,40 0 ${large},1 ${x2},${y2} Z" fill="${colors[i]}" stroke="var(--black2)" stroke-width="1"/>`;
    cumulative+=pct;
  });
  el.innerHTML=`<svg viewBox="0 0 100 100" width="160" class="donut-svg">${svgPaths}<circle cx="50" cy="50" r="22" fill="var(--black2)"/><text x="50" y="54" text-anchor="middle" fill="var(--yellow)" font-size="10" font-weight="bold">${total} Goals</text></svg>

}

function submitGoalSheet(){
  const allGoals=[...state.goals,...state.pendingGoals].filter(g=>g.owner==='employee');
  const pending=state.pendingGoals.filter(g=>g.owner==='employee'&&g.status==='Pending Approval');
  if(pending.length===0){toast('No pending goals to submit. Add goals first.','error');return;}
  const totalW=allGoals.reduce((s,g)=>s+g.weightage,0);
  if(totalW!==100){
    toast(`Total weightage is ${totalW}% — must be exactly 100% before submitting.`,'error');
    // Highlight the meter
    const meter=document.querySelector('.wgt-meter');
    if(meter){meter.style.boxShadow='0 0 0 2px var(--red)';setTimeout(()=>meter.style.boxShadow='',2000);}
    return;
  }
  if(allGoals.length<1){toast('Add at least one goal before submitting.','error');return;}
  openModal('Confirm Goal Sheet Submission',
    `<p style="font-size:14px;color:var(--grey);line-height:1.7;">You are about to submit <strong style="color:var(--white);">${pending.length} goal(s)</strong> for manager approval.<br/>Total weightage: <strong style="color:var(--green);">${totalW}%</strong><br/>Once submitted, goals will be locked after approval.</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="confirmSubmitSheet()">Confirm & Submit</button>`
  );
}
function confirmSubmitSheet(){
  closeModal();
  toast('Goal sheet submitted to manager for approval!','success');
  addAudit('Alice Sharma (Employee)','Submitted goal sheet for approval','All pending goals','Pending Manager review');
  state.notifications.unshift({id:Date.now(),type:'submit',title:'Goal Sheet Submitted',body:'Alice Sharma submitted goal sheet for approval',time:'Just now',read:false,icon:'📤'});
  buildNotifications();
}
function calcScore(g,q){
  const ach=g.achievement&&g.achievement[q];
  if(ach===null||ach===undefined)return 0;
  const tgt=g.target;
  const uom=g.uom;
  if(uom.includes('Min')||uom==='Percentage (Min)'){
    return Math.round(Math.min((ach/tgt)*100,150));
  } else if(uom.includes('Max')||uom==='Percentage (Max)'){
    return Math.round(Math.min((tgt/ach)*100,150));
  } else if(uom==='Zero'){
    return ach===0?100:0;
  } else if(uom==='Timeline'){
    return ach&&tgt?(new Date(ach)<=new Date(tgt)?100:60):0;
  }
  return Math.round(Math.min((ach/tgt)*100,100));
}

function updateWgtHint(val, existingWgt){
  const hint=document.getElementById('wgt-hint');
  if(!hint)return;
  const wgt=parseInt(val)||0;
  const currentTotal=[...state.goals,...state.pendingGoals].filter(g=>g.owner==='employee').reduce((s,g)=>s+g.weightage,0);
  const adjustedTotal=currentTotal-existingWgt+wgt;
  const remaining=100-currentTotal+existingWgt;
  if(adjustedTotal===100){
    hint.innerHTML='<span style="color:var(--green)">✓ Total will be exactly 100%</span>';
  } else if(adjustedTotal>100){
    hint.innerHTML=`<span style="color:var(--red)">✗ Exceeds 100% by ${adjustedTotal-100}% (remaining: ${remaining}%)</span>`;
  } else {
    hint.innerHTML=`<span style="color:var(--grey)">After adding: ${adjustedTotal}% total (${100-adjustedTotal}% remaining)</span>`;
  }
}

function submitGoal(){
  const title=document.getElementById('gf-title').value.trim();
  const thrust=document.getElementById('gf-thrust').value;
  const uom=document.getElementById('gf-uom').value;
  const target=document.getElementById('gf-target').value;
  const wgt=parseInt(document.getElementById('gf-wgt').value);
  const desc=document.getElementById('gf-desc').value;
  if(!title||!target){toast('Please fill in all required fields','error');return;}
  if(wgt<state.adminConfig.minWeightage){toast(`Minimum weightage is ${state.adminConfig.minWeightage}%`,'error');return;}
  const allGoals=[...state.goals,...state.pendingGoals].filter(g=>g.owner==='employee');
  if(allGoals.length>=state.adminConfig.maxGoals){toast(`Maximum ${state.adminConfig.maxGoals} goals allowed`,'error');return;}
  const projectedTotal=allGoals.reduce((s,g)=>s+g.weightage,0)+wgt;
  if(projectedTotal>100){toast(`Adding ${wgt}% would exceed 100% total (current: ${allGoals.reduce((s,g)=>s+g.weightage,0)}%). Adjust weightage.`,'error');return;}
  const newGoal={id:Date.now(),owner:'employee',title,thrust,desc,uom,target,weightage:wgt,status:'Pending Approval',locked:false,shared:false,achievement:{Q1:null,Q2:null,Q3:null,Q4:null},checkinComments:{}};
  state.pendingGoals.push(newGoal);
  addAudit('Alice Sharma (Employee)','Submitted new goal',title,'Status: Pending Approval');
  state.notifications.unshift({id:Date.now(),type:'submit',title:'Goal Submitted',body:`"${title}" sent to manager for approval`,time:'Just now',read:false,icon:'📤'});
  closeModal();
  toast('Goal submitted for approval!','success');
  saveState();
  renderGoals();
  buildNotifications();
}
function updateGoal(id){
  const g=state.pendingGoals.find(x=>x.id===id);
  if(!g)return;
  const newWgt=parseInt(document.getElementById('gf-wgt').value)||0;
  if(newWgt<state.adminConfig.minWeightage){toast(`Minimum weightage is ${state.adminConfig.minWeightage}%`,'error');return;}
  // Check total without this goal's old weightage
  const otherTotal=[...state.goals,...state.pendingGoals].filter(pg=>pg.owner==='employee'&&pg.id!==id).reduce((s,pg)=>s+pg.weightage,0);
  if(otherTotal+newWgt>100){toast(`Total weightage would be ${otherTotal+newWgt}% — must not exceed 100%.`,'error');return;}
  g.title=document.getElementById('gf-title').value;
  g.thrust=document.getElementById('gf-thrust').value;
  g.uom=document.getElementById('gf-uom').value;
  g.target=document.getElementById('gf-target').value;
  g.weightage=newWgt;
  g.desc=document.getElementById('gf-desc').value;
  addAudit('Alice Sharma (Employee)','Edited goal',g.title,'Updated before approval');
  closeModal();
  saveState();
  toast('Goal updated','success');
  renderGoals();
}
function deleteGoal(id){
  const g=state.pendingGoals.find(x=>x.id===id);
  state.pendingGoals=state.pendingGoals.filter(pg=>pg.id!==id);
  if(g)addAudit('Alice Sharma (Employee)','Deleted pending goal',g.title,'Removed before approval');
  saveState();

}

function saveCheckin(q){
  q=q||state.activeCheckinQuarter;
  const isQ2=q==='Q2';
  const windowOpen=isQ2||isCheckinWindowOpen(q);
  if(!windowOpen){toast('Check-in window is closed for '+q,'error');return;}
  state.goals.forEach(g=>{
    const achEl=document.getElementById('ach-'+g.id+'-'+q);
    const staEl=document.getElementById('sta-'+g.id+'-'+q);
    if(achEl&&achEl.value!==''){
      g.achievement[q]=g.uom==='Timeline'?achEl.value:parseFloat(achEl.value);
    }
    if(staEl&&staEl.value){g.status[q]=staEl.value;}
  });
  const qDoneMap={Q1:'q1Done',Q2:'q2Done',Q3:'q3Done'};
  if(qDoneMap[q]){
    const m=state.teamMembers.find(x=>x.id==='emp1');
    if(m)m[qDoneMap[q]]=true;
  }
  addAuditLocked('Alice Sharma (Employee)','Submitted '+q+' achievement update','All goals',q+' actuals recorded');
  // Sync shared goal achievements to all linked copies
  goals.forEach(g=>{
    if(g.shared && g.achievement[q]!==null){
      state.pendingGoals.forEach(pg=>{if(pg.sharedFrom===g.id){pg.achievement[q]=g.achievement[q];}});
      state.goals.forEach(ag=>{if(ag.sharedFrom===g.id){ag.achievement[q]=g.achievement[q];}});
    }
  });
  toast(q+' achievements saved & synced to shared goals!','success');
  saveState();
  renderCheckin();
}
function saveManagerComment(empId,q){
  q=q||state.activeCheckinQuarter;
  const m=state.teamMembers.find(x=>x.id===empId);
  const commentEl=document.getElementById('mgr-comment-'+empId+'-'+q);
  if(m&&commentEl){
    if(!m.checkinComments)m.checkinComments={};
    m.checkinComments[q]=commentEl.value;
  }
  addAuditLocked(state.user.name+' (Manager)','Added '+q+' check-in comment','Team member #'+empId,'Comment: '+(commentEl?commentEl.value.slice(0,40):'saved'));
  toast(q+' check-in comment saved','success');
  saveState();
}

function approveGoal(id){
  const g=state.pendingGoals.find(x=>x.id===id);
  if(!g)return;
  g.status='Approved';
  g.locked=true;
  state.goals.push(g);
  state.pendingGoals=state.pendingGoals.filter(x=>x.id!==id);
  state.teamMembers[0].goalsApproved++;
  addAudit('Bob Kumar (Manager)','Approved goal',g.title,'Goal locked');
  state.notifications.unshift({id:Date.now(),type:'approval',title:'Goal Approved',body:`"${g.title}" approved and locked`,time:'Just now',read:false,icon:'✅'});
  toast(`"${g.title}" approved and locked!`,'success');
  saveState();
  renderTeam();
  buildNotifications();
}
function returnGoal(id){
  const g=state.pendingGoals.find(x=>x.id===id);
  if(!g)return;
  g.status='Returned';
  addAudit('Bob Kumar (Manager)','Returned goal for rework',g.title,'Awaiting resubmission');
  toast('Goal returned for rework','info');
  renderTeam();
}
function pushSharedGoal(){
  // Get the selected shared goal template from shared goals list
  const sharedTemplates=state.goals.filter(g=>g.shared&&g.owner!=='employee');
  const template=sharedTemplates[0]||state.goals.find(g=>g.shared);
  if(template){
    // Check if already pushed
    const alreadyPushed=state.goals.find(g=>g.sharedFrom===template.id&&g.owner==='employee');
    if(!alreadyPushed){
      const pushedGoal={...template,id:Date.now(),owner:'employee',shared:true,locked:true,
        weightage:10,status:'Approved',sharedFrom:template.id,
        achievement:{Q1:null,Q2:null,Q3:null,Q4:null},checkinComments:{}};
      state.goals.push(pushedGoal);
    }
    // Sync latest achievement from primary to all copies
    state.goals.forEach(g=>{
      if(g.sharedFrom===template.id){
        Object.keys(template.achievement||{}).forEach(q=>{
          if(template.achievement[q]!==null) g.achievement[q]=template.achievement[q];
        });
      }
    });
  }
  addAudit('Bob Kumar (Manager)','Pushed shared goal to employees','Departmental KPI','Synced to 4 employees');
  toast('Shared goal pushed to 4 employees & achievement synced!','success');
  saveState();
  state.notifications.unshift({id:Date.now(),type:'shared',title:'Shared Goal Pushed',body:'Departmental Revenue Target pushed to team',time:'Just now',read:false,icon:'📤'});
  buildNotifications();
}

function buildAchievementRows(){

               'Q1 Score%','Q2 Score%','Q3 Score%','Q4 Score%',
               'Q1 Status','Q2 Status','Q3 Status','Q4 Status']];
  // Alice's goals (employee goals from state)
  state.goals.filter(g=>g.owner==='employee').forEach(g=>{
    rows.push([
      'Alice Sharma','Sales',g.title,g.thrust,g.uom,g.target,g.weightage+'%',

  state.teamMembers.filter(m=>m.id!=='emp1').forEach(m=>{

function exportCSV(){
  const rows=buildAchievementRows();
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='achievement_report_all_employees.csv';a.click();
  toast('CSV exported — all '+state.teamMembers.length+' employees!','success');
}
function exportExcel(){
  if(typeof XLSX==='undefined'){toast('SheetJS not loaded — check network','error');return;}
  const rows=buildAchievementRows();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  // Style header row bold by setting bold on header range
  const headerRange=XLSX.utils.decode_range(ws['!ref']);
  for(let C=headerRange.s.c;C<=headerRange.e.c;C++){
    const addr=XLSX.utils.encode_cell({r:0,c:C});
    if(!ws[addr])continue;
    ws[addr].s={font:{bold:true},fill:{fgColor:{rgb:'F5C518'}},alignment:{horizontal:'center'}};
  }
  // Auto column widths
  ws['!cols']=rows[0].map((_,i)=>({wch:Math.max(...rows.map(r=>String(r[i]||'').length),10)}));
  // Second sheet: Manager Effectiveness
  const mgr=[['Manager','Approval Rate','Q1 Check-in Rate','Q2 Check-in Rate','Avg Days to Approve'],
              ['Bob Kumar','100%',
               Math.round(state.teamMembers.filter(m=>m.q1Done).length/state.teamMembers.length*100)+'%',
               Math.round(state.teamMembers.filter(m=>m.q2Done).length/state.teamMembers.length*100)+'%',
               '2.1 days']];
  const ws2=XLSX.utils.aoa_to_sheet(mgr);
  ws2['!cols']=mgr[0].map((_,i)=>({wch:Math.max(...mgr.map(r=>String(r[i]||'').length),14)}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,'Achievement Report',ws);
  XLSX.utils.book_append_sheet(wb,'Manager Effectiveness',ws2);
  XLSX.writeFile(wb,'atomquest_achievement_report.xlsx');
  addAuditLocked(state.user.name+' ('+state.user.role+')','Exported Excel achievement report','All employees','XLSX downloaded');
  toast('Excel exported — '+state.teamMembers.length+' employees, 2 sheets!','success');
}

function renderAudit(){
  const el=document.getElementById('page-audit');
  const postLockCount=state.auditLog.filter(a=>a.postLock).length;
  el.innerHTML=`
  <div class="card">
    <div class="card-header"><div class="card-title">Audit Trail</div>
    <div class="flex gap-2">
      <select onchange="filterAuditType(this.value)" style="background:var(--black3);border:1px solid var(--black5);color:var(--white);padding:7px 10px;border-radius:var(--radius);font-size:12px;">
        <option value="all">All Events</option>
        <option value="postLock">Post-Lock Changes Only</option>
      </select>
      <input id="audit-search" placeholder="Search logs..." style="background:var(--black3);border:1px solid var(--black5);color:var(--white);padding:7px 12px;border-radius:var(--radius);font-size:12px;width:180px;" oninput="filterAudit(this.value)"/>
      <button class="btn btn-ghost btn-sm" onclick="exportAuditCSV()">⬇ Export</button>
    </div></div>
    ${postLockCount>0?`<div style="background:rgba(229,57,53,.08);border:1px solid rgba(229,57,53,.25);border-radius:4px;padding:10px 14px;margin-bottom:12px;font-size:12px;"><span style="color:var(--red);font-weight:600;">⚠ ${postLockCount} post-lock change${postLockCount>1?'s':''} recorded</span> <span style="color:var(--grey);">— changes made after goals were locked are highlighted below.</span></div>`:''}
    <div id="audit-list">
    ${state.auditLog.slice().reverse().map(a=>`<div class="audit-entry" data-postlock="${a.postLock||false}" style="${a.postLock?'border-left:2px solid var(--red);padding-left:10px;':''}" >
      <div class="audit-dot" style="${a.postLock?'background:var(--red);':''}"></div>
      <div>
        <div class="audit-line"><strong>${a.user}</strong> — ${a.action} ${a.postLock?'<span style="background:rgba(229,57,53,.15);color:var(--red);font-size:10px;padding:1px 6px;border-radius:4px;margin-left:4px;">POST-LOCK</span>':''}</div>
        <div class="audit-line">Goal/Target: <strong>${a.goal}</strong></div>
        <div class="audit-line">After: ${a.after}</div>
        <div class="audit-time">${a.when}</div>
      </div>
    </div>`).join('')}
    </div>
  </div>`;
}
function filterAuditType(val){
  const items=document.querySelectorAll('.audit-entry');
  items.forEach(item=>{
    if(val==='postLock'){
      item.style.display=item.dataset.postlock==='true'?'':'none';
    } else {
      item.style.display='';
    }
  });
}
function filterAudit(val){
  const items=document.querySelectorAll('.audit-entry');
  items.forEach(item=>{
    item.style.display=item.textContent.toLowerCase().includes(val.toLowerCase())?'':'none';
  });
}
function exportAuditCSV(){
  const rows=[['User','Action','Goal','After','When']];
  state.auditLog.forEach(a=>rows.push([a.user,a.action,a.goal,a.after,a.when]));
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='audit_trail.csv';a.click();
  toast('Audit log exported','success');
}
function addAudit(user,action,goal,after,postLock=false){
  state.auditLog.push({id:Date.now(),user,action,goal,after,when:new Date().toLocaleString('en-IN'),postLock});
}
function addAuditLocked(user,action,goal,after){
  // Specifically marks changes that happen after a goal lock date
  const isAfterLock=state.goals.some(g=>g.locked);
  addAudit(user,action,goal,after,isAfterLock);
}

function openModal(title,body,footer=''){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-footer').innerHTML=footer||`<button class="btn btn-ghost" onclick="closeModal()">Close</button>`;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal').classList.add('hidden');}

/* ===========================
   TOAST
   =========================== */
function toast(msg,type='info'){
  const container=document.getElementById('toast-container');
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  t.textContent=msg;
  container.appendChild(t);
  setTimeout(()=>{t.style.animation='fadeOut .3s ease forwards';setTimeout(()=>t.remove(),300);},3000);
}
